<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Add Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .admin-card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-left: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 16px 20px;
            background-color: #f8faff;
            border: 2px solid #f0f0f0;
            border-radius: 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            border-color: var(--accent-purple);
            background-color: white;
        }
    </style>
</head>
<body class="flex flex-col">
    <header class="bg-white px-4 h-[70px] flex items-center gap-4 border-b sticky top-0 z-50">
        <button class="p-2 -ml-2">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="flex-1">
            <h1 class="font-bold text-lg leading-tight">Add New Agent</h1>
            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Pilot Recruitment</p>
        </div>
    </header>

    <main class="flex-1 p-6 space-y-6">
        <div class="admin-card space-y-6">
            <div class="form-group">
                <label>Agent Name</label>
                <input type="text" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="agent@hoyo.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="+63 000 000 0000">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••">
            </div>

            <div class="pt-4 flex flex-col gap-3">
                <button class="w-full h-[56px] rounded-2xl bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white font-bold shadow-lg shadow-purple-500/20 active:scale-95 transition-all">
                    Create Account
                </button>
                <button class="w-full h-[56px] rounded-2xl bg-gray-50 text-gray-400 font-bold border border-gray-100">
                    Cancel
                </button>
            </div>
        </div>

        <div class="bg-blue-50 p-6 rounded-[24px] border border-blue-100 flex gap-4">
            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center shrink-0">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <p class="text-xs text-blue-800 leading-relaxed">Agents created here will have access to the Pilot Portal to handle customer orders.</p>
        </div>
    </main>
</body>
</html>
