<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Agent Task Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
            --btn-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .info-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="bg-white px-4 h-[70px] flex items-center gap-4 border-b sticky top-0 z-50">
        <button class="p-2 -ml-2">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="flex-1">
            <h1 class="font-bold text-lg leading-tight">Task #1204</h1>
            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Active Assignment</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-6 pb-24">
        <!-- Game Summary -->
        <div class="info-card brand-bg text-white border-none shadow-xl flex items-center gap-5">
            <div class="w-16 h-16 rounded-2xl bg-white/20 flex items-center justify-center backdrop-blur-md">
                <img src="../public/img/hsr icon.png" class="w-10 h-10 object-contain">
            </div>
            <div>
                <h2 class="font-bold text-xl">Honkai Star Rail</h2>
                <p class="text-xs opacity-70">Region: Xianzhou Luofu</p>
            </div>
        </div>

        <!-- Customer Info -->
        <section class="space-y-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest px-2">Customer Details</h3>
            <div class="info-card">
                <div class="flex items-center gap-4 mb-4">
                    <div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">JD</div>
                    <div class="flex-1">
                        <p class="font-bold text-gray-800">John Doe</p>
                        <p class="text-xs text-gray-400">john@example.com</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-50">
                    <div>
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Server</p>
                        <p class="text-sm font-bold">Asia</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-400 uppercase font-bold">UID</p>
                        <p class="text-sm font-bold">804251294</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Service Specs -->
        <section class="space-y-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest px-2">Service Specs</h3>
            <div class="info-card space-y-4">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500">Service</span>
                    <span class="font-bold">Daily Training</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500">Add-on</span>
                    <span class="font-bold">Simulated Universe</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-500">Price Share</span>
                    <span class="text-green-600 font-bold">₱175.00</span>
                </div>
            </div>
        </section>

        <!-- Status & Notes -->
        <section class="space-y-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest px-2">Status</h3>
            <div class="info-card bg-blue-50 border-blue-100 flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-lg">⏳</div>
                <div>
                    <p class="text-sm font-bold text-blue-900">Work in Progress</p>
                    <p class="text-xs text-blue-700 opacity-70">Started 45 mins ago</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Actions -->
    <div class="fixed bottom-0 w-[390px] p-6 bg-white border-t flex gap-3 shrink-0 z-50">
        <button class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-500 shadow-sm relative">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <span class="absolute top-2 right-2 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></span>
        </button>
        <button class="flex-1 bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white py-4 rounded-2xl font-bold text-sm shadow-xl shadow-purple-500/20 active:scale-95 transition-all">
            COMPLETE TASK
        </button>
    </div>
</body>
</html>
