<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
            --btn-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .profile-header {
            background: var(--brand-gradient);
            padding: 40px 20px 60px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            text-align: center;
            color: white;
            position: relative;
        }
        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto 15px;
            overflow: hidden;
            background-color: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .order-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-progress { background: #cfe2ff; color: #084298; }
        .status-completed { background: #d1e7dd; color: #0f5132; }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <div class="profile-header">
        <div class="absolute top-6 left-6 text-white/80">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </div>
        <div class="avatar-container">JD</div>
        <h1 class="text-2xl font-bold">John Doe</h1>
        <p class="opacity-70 text-sm">Customer since 2026</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 gap-4 px-6 -mt-8 mb-8">
        <div class="bg-white p-4 rounded-2xl shadow-lg text-center border border-gray-100">
            <span class="block text-2xl font-bold text-gray-800">12</span>
            <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Total Orders</span>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-lg text-center border border-gray-100">
            <span class="block text-2xl font-bold text-accent-purple">₱2,450</span>
            <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Total Spent</span>
        </div>
    </div>

    <!-- Active Orders -->
    <main class="px-6 flex flex-col gap-6 flex-1">
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-bold text-gray-800 tracking-tight">Active Orders</h2>
            <button class="text-accent-purple text-xs font-bold uppercase">View History</button>
        </div>

        <div class="order-card border-l-4 border-accent-purple">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="font-bold text-gray-900">Order #1204</h3>
                    <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest mt-1">Honkai Star Rail</p>
                </div>
                <span class="status-badge status-progress">In Progress</span>
            </div>
            <div class="text-xs text-gray-600 mb-6 leading-relaxed">
                Daily Commissions, Simulated Universe World 4 Clear
            </div>
            <div class="flex gap-3">
                <button class="flex-1 bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white py-3 rounded-xl text-xs font-bold shadow-lg shadow-purple-500/20">Details</button>
                <button class="w-12 h-12 bg-gray-100 text-gray-700 rounded-xl flex items-center justify-center">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Account Info -->
        <div class="bg-white p-6 rounded-[30px] border border-gray-100 space-y-4">
            <h3 class="font-bold text-gray-800">Account Settings</h3>
            <div class="flex items-center gap-4 py-2">
                <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div class="flex-1">
                    <p class="text-sm font-bold text-gray-800">Personal Info</p>
                    <p class="text-[10px] text-gray-400">Name, email, and phone</p>
                </div>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
            </div>
            <div class="flex items-center gap-4 py-2 border-t border-gray-50 pt-4">
                <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <div class="flex-1">
                    <p class="text-sm font-bold text-gray-800">Security</p>
                    <p class="text-[10px] text-gray-400">Change your password</p>
                </div>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
            </div>
        </div>
    </main>

    <!-- Tab Bar -->
    <footer class="h-[80px] bg-white border-t border-gray-200 flex justify-around items-center px-4">
        <div class="flex flex-col items-center text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="text-[10px] mt-1 uppercase">Home</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m-1 4h1m5-12v12"/></svg>
            <span class="text-[10px] mt-1 uppercase">Orders</span>
        </div>
        <div class="flex flex-col items-center text-accent-purple">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[10px] mt-1 font-bold uppercase">Account</span>
        </div>
    </footer>
</body>
</html>
