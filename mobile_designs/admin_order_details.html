<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Admin Order Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
            --btn-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .admin-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f8f9fb;
        }
        .detail-row:last-child { border-bottom: none; }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="bg-white px-4 h-[70px] flex items-center gap-4 border-b sticky top-0 z-50">
        <button class="p-2 -ml-2">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="flex-1">
            <h1 class="font-bold text-lg leading-tight">Order #1204</h1>
            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Management</p>
        </div>
        <div class="status-badge bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase">Progress</div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-6 pb-24">
        <!-- Service Summary -->
        <div class="admin-card bg-gradient-to-br from-gray-900 to-gray-800 text-white border-none shadow-xl">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center border border-white/20">
                    <img src="../public/img/hsr icon.png" class="w-8 h-8 object-contain">
                </div>
                <div>
                    <h2 class="font-bold text-lg">Honkai Star Rail</h2>
                    <p class="text-xs opacity-60">Customer: John Doe</p>
                </div>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between text-sm">
                    <span class="opacity-60">Service</span>
                    <span class="font-bold text-right">Daily Training + SU</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="opacity-60">Price</span>
                    <span class="font-bold text-accent-purple text-lg">₱250.00</span>
                </div>
            </div>
        </div>

        <!-- Assignment -->
        <section class="space-y-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest px-2">Assign Pilot</h3>
            <div class="admin-card">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-purple-50 text-accent-purple flex items-center justify-center font-bold">AC</div>
                    <div class="flex-1">
                        <p class="text-sm font-bold text-gray-800">Alex Carter</p>
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Currently Handling 4</p>
                    </div>
                    <button class="text-accent-purple text-xs font-bold">CHANGE</button>
                </div>
                <div class="pt-4 border-t border-gray-50 flex gap-2">
                    <button class="flex-1 bg-gray-50 text-gray-500 py-3 rounded-xl text-xs font-bold">UNASSIGN</button>
                    <button class="flex-1 bg-green-50 text-green-600 py-3 rounded-xl text-xs font-bold">MESSAGE</button>
                </div>
            </div>
        </section>

        <!-- Timeline -->
        <section class="space-y-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest px-2">Timeline</h3>
            <div class="admin-card space-y-4">
                <div class="flex gap-4">
                    <div class="flex flex-col items-center">
                        <div class="w-3 h-3 rounded-full bg-green-500 ring-4 ring-green-500/20"></div>
                        <div class="w-0.5 h-full bg-gray-100 my-1"></div>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-gray-800">Order Created</p>
                        <p class="text-[10px] text-gray-400">Apr 20, 2026 - 09:41 AM</p>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="flex flex-col items-center">
                        <div class="w-3 h-3 rounded-full bg-blue-500 ring-4 ring-blue-500/20"></div>
                        <div class="w-0.5 h-full bg-gray-100 my-1"></div>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-gray-800">Agent Assigned</p>
                        <p class="text-[10px] text-gray-400">Apr 20, 2026 - 10:15 AM</p>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="flex flex-col items-center">
                        <div class="w-3 h-3 rounded-full bg-gray-200"></div>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-gray-300">Completion Pending</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Actions -->
    <div class="fixed bottom-0 w-[390px] p-6 bg-white border-t flex gap-3 z-50">
        <button class="flex-1 border-2 border-red-500 text-red-500 py-4 rounded-2xl font-bold text-sm active:bg-red-50 transition-all">
            DELETE
        </button>
        <button class="flex-[2] bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white py-4 rounded-2xl font-bold text-sm shadow-xl shadow-purple-500/20 active:scale-95 transition-all">
            MARK COMPLETE
        </button>
    </div>
</body>
</html>
