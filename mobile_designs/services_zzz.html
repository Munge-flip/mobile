<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - ZZZ Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .service-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .mode-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #eee;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
        }
        .sticky-footer {
            background: white;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="bg-white px-4 h-[70px] flex items-center gap-4 border-b sticky top-0 z-50">
        <button class="p-2 -ml-2">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="flex-1 text-center pr-8">
            <h1 class="font-bold text-lg leading-tight">Zenless Zone Zero</h1>
        </div>
    </header>

    <div class="flex-1 overflow-y-auto pb-[140px]">
        <!-- Banner -->
        <div class="w-full h-40 overflow-hidden">
            <img src="../public/img/zzz banner.png" class="w-full h-full object-cover">
        </div>

        <div class="p-6 space-y-8">
            <!-- Hollow Zero -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Hollow Zero</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="mode-card border-accent-purple bg-purple-50 text-accent-purple">Lost Void</div>
                    <div class="mode-card">Withered Domain</div>
                </div>
            </section>

            <!-- Services -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Daily Maintenance</h2>
                <div class="flex flex-col gap-3">
                    <button class="service-btn">
                        <span class="font-bold">Inter-Knot Tasks</span>
                        <span class="text-accent-purple font-bold">₱50</span>
                    </button>
                    <button class="service-btn">
                        <span class="font-bold">Coffee & Scratch</span>
                        <span class="text-accent-purple font-bold">₱20</span>
                    </button>
                </div>
            </section>

            <!-- Combat -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Combat Services</h2>
                <div class="flex flex-col gap-3">
                    <button class="service-btn">
                        <span class="font-bold">Shiyu Defense</span>
                        <span class="text-accent-purple font-bold">₱200</span>
                    </button>
                    <button class="service-btn">
                        <span class="font-bold">Notorious Hunt</span>
                        <span class="text-accent-purple font-bold">₱100</span>
                    </button>
                </div>
            </section>
        </div>
    </div>

    <!-- Sticky Footer -->
    <div class="sticky-footer fixed bottom-0 w-[390px] p-6 space-y-4">
        <div class="flex justify-between items-center px-2">
            <span class="font-bold text-gray-400">Total Price</span>
            <span class="text-2xl font-bold text-accent-purple">₱0.00</span>
        </div>
        <button class="w-full h-[60px] rounded-2xl bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white font-bold text-lg shadow-xl opacity-50 cursor-not-allowed">
            Get Service
        </button>
    </div>
</body>
</html>
