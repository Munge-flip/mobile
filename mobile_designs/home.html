<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Mobile Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background: var(--brand-gradient);
            min-height: 844px;
            width: 390px;
        }
        .nav-glass {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
        }
        .game-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            aspect-ratio: 16/9;
            width: 100%;
            transition: all 0.3s ease;
        }
        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .game-card .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .game-card .title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="nav-glass h-[80px] flex items-center justify-between px-6 sticky top-0 z-50">
        <div class="h-[50px] w-[50px] rounded-full overflow-hidden border-2 border-accent-purple shadow-lg shadow-purple-500/20">
            <img src="../public/img/weblogo.png" alt="Logo" class="w-full h-full object-cover">
        </div>
        <button class="text-white">
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16m-7 6h7"/>
            </svg>
        </button>
    </header>

    <!-- Content -->
    <main class="flex-1 p-6 flex flex-col gap-6 pt-8">
        <div class="text-white space-y-2">
            <h1 class="text-3xl font-bold">Hello!</h1>
            <p class="opacity-80 text-lg">Pick a game to get started</p>
        </div>

        <!-- Genshin -->
        <div class="game-card">
            <img src="../public/img/genshin.png" alt="Genshin Impact">
            <div class="overlay">
                <span class="title">GENSHIN IMPACT</span>
            </div>
        </div>

        <!-- HSR -->
        <div class="game-card">
            <img src="../public/img/hsr.png" alt="Honkai Star Rail">
            <div class="overlay">
                <span class="title">HONKAI STAR RAIL</span>
            </div>
        </div>

        <!-- ZZZ -->
        <div class="game-card">
            <img src="../public/img/zzz.png" alt="Zenless Zone Zero">
            <div class="overlay">
                <span class="title">ZENLESS ZONE ZERO</span>
            </div>
        </div>
    </main>

    <!-- Tab Bar -->
    <footer class="h-[80px] bg-white border-t border-gray-200 flex justify-around items-center px-4">
        <div class="flex flex-col items-center text-accent-purple">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="text-[10px] mt-1 font-bold uppercase">Home</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m-1 4h1m5-12v12"/></svg>
            <span class="text-[10px] mt-1 uppercase">Orders</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[10px] mt-1 uppercase">Account</span>
        </div>
    </footer>
</body>
</html>
