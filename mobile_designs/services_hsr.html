<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - HSR Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .service-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .world-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #eee;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
        }
        .exploration-card {
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
        }
        .exploration-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .exploration-card .label {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }
        .sticky-footer {
            background: white;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="bg-white px-4 h-[70px] flex items-center gap-4 border-b sticky top-0 z-50">
        <button class="p-2 -ml-2">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="flex-1 text-center pr-8">
            <h1 class="font-bold text-lg leading-tight">Honkai Star Rail</h1>
        </div>
    </header>

    <div class="flex-1 overflow-y-auto pb-[140px]">
        <!-- Banner -->
        <div class="w-full h-40 overflow-hidden">
            <img src="../public/img/hsr banner.png" class="w-full h-full object-cover">
        </div>

        <div class="p-6 space-y-8">
            <!-- Simulated Universe -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Simulated Universe</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="world-card border-accent-purple bg-purple-50 text-accent-purple">Swarm Disaster</div>
                    <div class="world-card">Gold and Gears</div>
                </div>
            </section>

            <!-- Explorations -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Explorations</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="exploration-card">
                        <img src="../public/img/Herta-Space-Station banner.png">
                        <div class="label">Herta Station</div>
                    </div>
                    <div class="exploration-card">
                        <img src="../public/img/jarilo banner.png">
                        <div class="label">Jarilo-VI</div>
                    </div>
                    <div class="exploration-card">
                        <img src="../public/img/xianzhou banner.png">
                        <div class="label">Xianzhou</div>
                    </div>
                    <div class="exploration-card">
                        <img src="../public/img/penacony banner.png">
                        <div class="label">Penacony</div>
                    </div>
                    <div class="exploration-card opacity-50 grayscale">
                        <img src="../public/img/amphoreus banner.png">
                        <div class="label bg-black/20">Amphoreus</div>
                    </div>
                </div>
            </section>

            <!-- Services -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Services</h2>
                <div class="flex flex-col gap-3">
                    <button class="service-btn">
                        <span class="font-bold">Daily Training</span>
                        <span class="text-accent-purple font-bold">₱50</span>
                    </button>
                    <button class="service-btn">
                        <span class="font-bold">Echo of War</span>
                        <span class="text-accent-purple font-bold">₱100</span>
                    </button>
                </div>
            </section>
        </div>
    </div>

    <!-- Sticky Footer -->
    <div class="sticky-footer fixed bottom-0 w-[390px] p-6 space-y-4">
        <div class="flex justify-between items-center px-2">
            <span class="font-bold text-gray-400">Total Price</span>
            <span class="text-2xl font-bold text-accent-purple">₱0.00</span>
        </div>
        <button class="w-full h-[60px] rounded-2xl bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white font-bold text-lg shadow-xl opacity-50 cursor-not-allowed">
            Get Service
        </button>
    </div>
</body>
</html>
