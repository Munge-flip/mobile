<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --auth-panel-bg: #A38141;
            --auth-form-bg: #14171D;
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #1E222A;
            min-height: 844px;
            width: 390px;
        }
        .promo-panel {
            background-color: var(--auth-panel-bg);
            padding: 30px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }
        .form-panel {
            background-color: var(--auth-form-bg);
            padding: 30px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 50px;
            background-color: white;
            font-size: 14px;
            outline: none;
        }
        .submit-btn {
            background-color: rgba(255, 255, 255, 0.9);
            color: #14171D;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
        }
    </style>
</head>
<body class="flex flex-col">
    <div class="promo-panel flex flex-col items-center text-center gap-3">
        <h2 class="text-xl font-bold text-white uppercase">ALREADY HAVE AN ACCOUNT?</h2>
        <p class="text-white/80 text-xs leading-relaxed">Sign in to our account and enjoy your service with Hoyo Piloting service</p>
        <button class="bg-white/20 text-white border border-white/30 px-6 py-2 rounded-full font-bold text-xs mt-1">Sign In</button>
    </div>

    <div class="form-panel flex-1 flex flex-col gap-6 pt-8">
        <h2 class="text-2xl font-bold text-[#A38141] tracking-widest uppercase text-center">SIGN UP</h2>

        <form class="flex flex-col gap-4">
            <div class="form-group"><input type="text" placeholder="Full Name" required></div>
            <div class="form-group"><input type="email" placeholder="Email Address" required></div>
            <div class="form-group"><input type="tel" placeholder="Phone Number" required></div>
            <div class="form-group"><input type="password" placeholder="Password" required></div>
            <div class="form-group"><input type="password" placeholder="Confirm Password" required></div>

            <div class="flex justify-center mt-4">
                <button type="submit" class="submit-btn w-full">Create Account</button>
            </div>
        </form>
        
        <p class="text-gray-500 text-[10px] text-center px-4 leading-relaxed">
            By creating an account, you agree to our <a href="#" class="text-[#A38141] underline">Terms of Service</a> and <a href="#" class="text-[#A38141] underline">Privacy Policy</a>.
        </p>
    </div>
</body>
</html>
