<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-purple: #a78bfa;
            --btn-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="bg-white px-6 h-[80px] flex items-center justify-between border-b shrink-0">
        <div>
            <h1 class="font-bold text-xl text-gray-800">Admin Panel</h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Management Overview</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-8">
        <!-- Main Stats -->
        <section class="grid grid-cols-2 gap-4">
            <div class="stat-card">
                <div class="icon-box bg-blue-50 text-blue-500">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg>
                </div>
                <span class="block text-2xl font-bold text-gray-800">124</span>
                <span class="text-[10px] text-gray-400 font-bold uppercase">Total Orders</span>
            </div>
            <div class="stat-card">
                <div class="icon-box bg-green-50 text-green-500">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1v22m5-18H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                </div>
                <span class="block text-2xl font-bold text-gray-800">₱45.2k</span>
                <span class="text-[10px] text-gray-400 font-bold uppercase">Revenue</span>
            </div>
            <div class="stat-card">
                <div class="icon-box bg-orange-50 text-orange-500">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                </div>
                <span class="block text-2xl font-bold text-gray-800">12</span>
                <span class="text-[10px] text-gray-400 font-bold uppercase">Pending</span>
            </div>
            <div class="stat-card">
                <div class="icon-box bg-purple-50 text-purple-500">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                </div>
                <span class="block text-2xl font-bold text-gray-800">8</span>
                <span class="text-[10px] text-gray-400 font-bold uppercase">Active Agents</span>
            </div>
        </section>

        <!-- Recent Activity -->
        <section class="space-y-4">
            <div class="flex justify-between items-center px-2">
                <h2 class="font-bold text-gray-800 uppercase text-xs tracking-[1px]">Recent Activity</h2>
                <button class="text-accent-purple font-bold text-[10px] uppercase">See All</button>
            </div>
            
            <div class="space-y-3">
                <div class="flex gap-4 p-4 bg-white rounded-2xl border border-gray-100 items-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-lg">📦</div>
                    <div class="flex-1">
                        <p class="text-xs font-bold text-gray-800">New order #1255</p>
                        <p class="text-[10px] text-gray-400">Genshin - John Doe</p>
                    </div>
                    <span class="text-[9px] text-gray-300 font-bold">2m ago</span>
                </div>
                <div class="flex gap-4 p-4 bg-white rounded-2xl border border-gray-100 items-center shadow-sm">
                    <div class="w-10 h-10 rounded-full bg-green-50 text-green-500 flex items-center justify-center text-lg">💳</div>
                    <div class="flex-1">
                        <p class="text-xs font-bold text-gray-800">Transaction verified</p>
                        <p class="text-[10px] text-gray-400">#1204 - ₱250.00</p>
                    </div>
                    <span class="text-[9px] text-gray-300 font-bold">15m ago</span>
                </div>
                <div class="flex gap-4 p-4 bg-white rounded-2xl border border-gray-100 items-center shadow-sm opacity-60">
                    <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-500 flex items-center justify-center text-lg">✅</div>
                    <div class="flex-1">
                        <p class="text-xs font-bold text-gray-800">Order #1190 completed</p>
                        <p class="text-[10px] text-gray-400">HSR - Alex C.</p>
                    </div>
                    <span class="text-[9px] text-gray-300 font-bold">1h ago</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Admin Nav -->
    <footer class="h-[80px] bg-white border-t flex justify-around items-center px-4 shrink-0">
        <div class="flex flex-col items-center text-accent-purple">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M4 3h7v7H4V3zm0 11h7v7H4v-7zm11-11h7v7h-7V3zm0 11h7v7h-7v-7z"/></svg>
            <span class="text-[9px] mt-1 font-bold uppercase">Dash</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span class="text-[9px] mt-1 uppercase">Orders</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span class="text-[9px] mt-1 uppercase">Services</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <span class="text-[9px] mt-1 uppercase">Agents</span>
        </div>
    </footer>
</body>
</html>
