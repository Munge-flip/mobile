<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            --accent-purple: #a78bfa;
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .agent-card {
            background: var(--brand-gradient);
            padding: 30px 20px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        .stat-badge {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 20px;
            text-align: center;
        }
        .task-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .status-active { background: #cfe2ff; color: #084298; }
        .status-done { background: #d1e7dd; color: #0f5132; }
    </style>
</head>
<body class="flex flex-col">
    <!-- Agent Profile Section -->
    <div class="agent-card space-y-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-white text-accent-purple flex items-center justify-center text-xl font-bold shadow-lg">
                    AC
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Alex Carter</h1>
                    <p class="text-[10px] opacity-70 uppercase font-bold tracking-widest">Certified Pilot #08</p>
                </div>
            </div>
            <span class="w-3 h-3 bg-green-400 rounded-full ring-4 ring-green-400/20"></span>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="stat-badge">
                <span class="block text-lg font-bold">4</span>
                <span class="text-[8px] opacity-70 uppercase font-bold">Handling</span>
            </div>
            <div class="stat-badge">
                <span class="block text-lg font-bold">142</span>
                <span class="text-[8px] opacity-70 uppercase font-bold">Done</span>
            </div>
            <div class="stat-badge">
                <span class="block text-lg font-bold">98%</span>
                <span class="text-[8px] opacity-70 uppercase font-bold">Success</span>
            </div>
        </div>
    </div>

    <!-- Task List -->
    <main class="flex-1 overflow-y-auto p-6 space-y-6">
        <div class="flex justify-between items-center px-2">
            <h2 class="font-bold text-gray-800 text-lg">My Active Tasks</h2>
            <span class="bg-accent-purple/10 text-accent-purple text-[10px] px-2 py-1 rounded-lg font-bold tracking-wider">REFRESH</span>
        </div>

        <div class="space-y-4">
            <!-- Task 1 -->
            <div class="task-card border-l-4 border-accent-purple space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-gray-400 font-bold tracking-widest">ORDER #1204</span>
                    <span class="text-[10px] px-3 py-1 rounded-full font-bold uppercase status-active">Active</span>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800">HSR: Simulated Universe</h3>
                    <div class="flex items-center gap-2 mt-1 text-gray-500 text-xs">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span>John Doe</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="flex-1 bg-gradient-to-r from-[#667eea] to-[#764ba2] text-white py-3 rounded-xl text-xs font-bold shadow-md shadow-purple-500/10">Details</button>
                    <button class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center relative">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[8px] text-white flex items-center justify-center border-2 border-white">2</span>
                    </button>
                </div>
            </div>

            <!-- Task 2 -->
            <div class="task-card border-l-4 border-yellow-400 space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-gray-400 font-bold tracking-widest">ORDER #1210</span>
                    <span class="text-[10px] px-3 py-1 rounded-full font-bold uppercase status-active">Pending Info</span>
                </div>
                <h3 class="font-bold text-gray-800">Genshin: Weekly Bosses</h3>
                <button class="w-full bg-gray-100 text-gray-600 py-3 rounded-xl text-xs font-bold">Details</button>
            </div>
        </div>
    </main>

    <!-- Agent Nav -->
    <footer class="h-[80px] bg-white border-t flex justify-around items-center px-4 shrink-0">
        <div class="flex flex-col items-center text-accent-purple">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="text-[10px] mt-1 font-bold uppercase">Tasks</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <span class="text-[10px] mt-1 uppercase">Chat</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[10px] mt-1 uppercase">Profile</span>
        </div>
    </footer>
</body>
</html>
