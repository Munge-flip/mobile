<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=390, initial-scale=1.0">
    <title>Hoyo Piloting - Admin Order List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-purple: #a78bfa;
        }
        body {
            font-family: 'Syne', sans-serif;
            margin: 0;
            background-color: #f9faff;
            min-height: 844px;
            width: 390px;
        }
        .order-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .order-card:active { transform: scale(0.98); }
        .filter-chip {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            background: white;
            border: 1px solid #eee;
            color: #999;
            white-space: nowrap;
        }
        .filter-chip.active {
            background: #111;
            border-color: #111;
            color: white;
        }
    </style>
</head>
<body class="flex flex-col">
    <!-- Header -->
    <header class="bg-white px-6 h-[80px] flex items-center justify-between border-b shrink-0 sticky top-0 z-50">
        <h1 class="font-bold text-xl text-gray-800">Orders</h1>
        <div class="flex gap-2">
            <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </button>
            <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
            </button>
        </div>
    </header>

    <!-- Filters -->
    <div class="px-6 py-4 flex gap-2 overflow-x-auto no-scrollbar shrink-0">
        <button class="filter-chip active uppercase">All</button>
        <button class="filter-chip uppercase text-yellow-600 border-yellow-100">Unassigned</button>
        <button class="filter-chip uppercase text-blue-600 border-blue-100">Progress</button>
        <button class="filter-chip uppercase text-green-600 border-green-100">Done</button>
    </div>

    <main class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- Order Card 1 -->
        <div class="order-card border-l-4 border-red-500">
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-md overflow-hidden bg-gray-100">
                        <img src="../public/img/hsr icon.png" class="w-full h-full object-contain">
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">#1255</span>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded bg-red-50 text-red-600 font-bold uppercase">Unassigned</span>
            </div>
            <h2 class="font-bold text-gray-800">HSR: Daily + Echo</h2>
            <div class="flex justify-between items-center mt-4">
                <div class="flex -space-x-2">
                    <div class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white flex items-center justify-center text-[8px] text-white font-bold">JD</div>
                </div>
                <span class="text-xs font-bold text-gray-800">₱150.00</span>
            </div>
        </div>

        <!-- Order Card 2 -->
        <div class="order-card border-l-4 border-blue-500">
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-md overflow-hidden bg-gray-100">
                        <img src="../public/img/paimon logo.png" class="w-full h-full object-contain">
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">#1254</span>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded bg-blue-50 text-blue-600 font-bold uppercase">Progress</span>
            </div>
            <h2 class="font-bold text-gray-800">Genshin: Commissions</h2>
            <div class="flex justify-between items-center mt-4">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white flex items-center justify-center text-[8px] text-white font-bold">JD</div>
                    <span class="text-[10px] text-gray-400 font-bold">→</span>
                    <div class="w-6 h-6 rounded-full bg-purple-500 border-2 border-white flex items-center justify-center text-[8px] text-white font-bold">AC</div>
                </div>
                <span class="text-xs font-bold text-gray-800">₱50.00</span>
            </div>
        </div>

        <!-- Order Card 3 -->
        <div class="order-card border-l-4 border-green-500 opacity-70">
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-md overflow-hidden bg-gray-100">
                        <img src="../public/img/zzz icon.png" class="w-full h-full object-contain">
                    </div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">#1250</span>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded bg-green-50 text-green-600 font-bold uppercase">Done</span>
            </div>
            <h2 class="font-bold text-gray-800">ZZZ: Shiyu Defense</h2>
            <div class="flex justify-between items-center mt-4">
                <span class="text-[10px] text-gray-300 font-bold italic">Completed 1h ago</span>
                <span class="text-xs font-bold text-gray-400">₱200.00</span>
            </div>
        </div>
    </main>

    <!-- Admin Nav -->
    <footer class="h-[80px] bg-white border-t flex justify-around items-center px-4 shrink-0">
        <div class="flex flex-col items-center text-gray-400">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 3h7v7H4V3zm0 11h7v7H4v-7zm11-11h7v7h-7V3zm0 11h7v7h-7v-7z"/></svg>
            <span class="text-[9px] mt-1 uppercase">Dash</span>
        </div>
        <div class="flex flex-col items-center text-accent-purple">
            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <span class="text-[9px] mt-1 font-bold uppercase">Orders</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span class="text-[9px] mt-1 uppercase">Services</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <span class="text-[9px] mt-1 uppercase">Agents</span>
        </div>
    </footer>
</body>
</html>
