<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Review - Admin Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Syne', sans-serif; }</style>
</head>
<body class="bg-[#f1f5f9] min-h-screen">

    <!-- Header -->
    <header class="p-4 flex items-center gap-4 sticky top-0 z-50 bg-[#1e293b] text-white">
        <a href="admin-transactions.html" class="p-2 bg-white/10 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </a>
        <h1 class="text-lg font-bold tracking-tight">Review Payment</h1>
    </header>

    <main class="p-6 space-y-6">
        <!-- Transaction Summary -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 text-center">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Amount</p>
            <h2 class="text-3xl font-black text-slate-800 mb-4">₱120.00</h2>
            <div class="inline-flex items-center gap-2 px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold uppercase">
                GCash • TRX-9821-HP
            </div>
        </div>

        <!-- Proof Image -->
        <div class="space-y-3">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Payment Proof</h3>
            <div class="bg-white rounded-3xl p-2 shadow-sm border border-slate-100 overflow-hidden aspect-[3/4]">
                <!-- Placeholder for Payment Proof Image -->
                <div class="w-full h-full bg-slate-50 rounded-2xl flex items-center justify-center text-slate-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 pt-4">
            <button class="flex-1 py-4 bg-red-50 text-red-500 font-bold rounded-2xl active:bg-red-100 transition-colors uppercase text-xs">
                Reject
            </button>
            <button class="flex-[2] py-4 bg-green-600 text-white font-bold rounded-2xl shadow-lg shadow-green-100 active:scale-95 transition-transform uppercase text-xs">
                Verify Payment
            </button>
        </div>
    </main>

</body>
</html>
