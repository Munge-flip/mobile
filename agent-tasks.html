<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Agent Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Syne', sans-serif; }</style>
</head>
<body class="bg-[#f0f9f9] min-h-screen pb-24">

    <!-- Header -->
    <header class="p-4 flex items-center gap-4 sticky top-0 z-50 bg-[#1e1e1e]/90 backdrop-blur-md border-b border-white/10 text-white shadow-lg">
        <a href="agent-dashboard.html" class="p-2 bg-white/10 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </a>
        <h1 class="text-lg font-bold tracking-tight">Active Tasks</h1>
    </header>

    <main class="p-4 space-y-4">
        
        <!-- Filter Tabs -->
        <div class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
            <button class="px-6 py-2 bg-emerald-600 text-white text-xs font-bold rounded-full whitespace-nowrap shadow-lg shadow-emerald-100">Ongoing</button>
            <button class="px-6 py-2 bg-white text-teal-500 text-xs font-bold rounded-full border border-emerald-100 whitespace-nowrap">Completed</button>
        </div>

        <!-- Task Card 1 -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-50">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="font-black text-gray-800 uppercase tracking-tighter">Order #HP-992</h3>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest italic">Genshin Impact</p>
                </div>
                <span class="px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-black uppercase tracking-widest rounded-full">In Progress</span>
            </div>
            
            <div class="space-y-2 mb-6">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">Service:</span>
                    <span class="text-gray-800 font-bold">100% Map Completion</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">Customer:</span>
                    <span class="text-emerald-600 font-bold italic">User@4421</span>
                </div>
            </div>

            <a href="agent-task-details.html" class="block w-full py-4 text-center bg-[#f0f9f9] text-emerald-600 font-black rounded-2xl active:bg-emerald-50 transition-colors uppercase text-xs tracking-widest">
                Manage Progress
            </a>
        </div>
    </main>

    <!-- Agent Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1e1e1e]/95 backdrop-blur-lg border-t border-white/10 px-6 py-3 flex justify-between items-center z-50 text-white/50 shadow-[0_-10px_30px_rgba(0,0,0,0.1)]">
        <a href="agent-dashboard.html" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px] font-bold uppercase">Stats</span>
        </a>
        <a href="agent-tasks.html" class="flex flex-col items-center gap-1 text-emerald-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <span class="text-[10px] font-bold uppercase">Tasks</span>
        </a>
        <a href="agent-chat.html" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
            <span class="text-[10px] font-bold uppercase">Chat</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            <span class="text-[10px] font-bold uppercase">Logout</span>
        </a>
    </nav>

</body>
</html>
