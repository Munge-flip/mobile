<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Syne', sans-serif; }</style>
</head>
<body class="bg-[#f1f5f9] min-h-screen pb-24">

    <!-- Header -->
    <header class="p-4 flex items-center gap-4 sticky top-0 z-50 bg-[#1e1e1e]/90 backdrop-blur-md border-b border-white/10 text-white">
        <a href="admin-dashboard.html" class="p-2 bg-white/10 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </a>
        <h1 class="text-lg font-bold tracking-tight">System Settings</h1>
    </header>

    <main class="p-4 space-y-6">
        
        <!-- Admin Profile Summary -->
        <section class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 flex items-center gap-4">
            <div class="w-16 h-14 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-black text-xl shadow-lg">AD</div>
            <div class="flex-1">
                <h2 class="font-bold text-slate-800 text-lg leading-none">Super Admin</h2>
                <p class="text-xs text-slate-400 mt-1">admin@hoyopiloting.com</p>
            </div>
            <button class="p-2 bg-slate-50 text-blue-600 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
            </button>
        </section>

        <!-- Platform Controls -->
        <section class="space-y-3">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Platform Status</h2>
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 divide-y divide-slate-50">
                <div class="p-5 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-700">Maintenance Mode</p>
                        <p class="text-[10px] text-slate-400">Disable public ordering</p>
                    </div>
                    <div class="w-12 h-6 bg-slate-200 rounded-full relative">
                        <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
                    </div>
                </div>
                <div class="p-5 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-700">New Registrations</p>
                        <p class="text-[10px] text-slate-400">Allow new users to sign up</p>
                    </div>
                    <div class="w-12 h-6 bg-green-500 rounded-full relative">
                        <div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Security -->
        <section class="space-y-3">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest ml-1">Security</h2>
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100">
                <button class="w-full p-5 flex items-center justify-between active:bg-slate-50 transition-colors text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-red-50 text-red-500 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                        </div>
                        <span class="font-bold text-slate-700">Update Password</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                </button>
            </div>
        </section>

        <!-- Danger Zone -->
        <section class="pt-4">
            <button class="w-full flex items-center justify-center gap-3 py-5 bg-white text-red-500 font-black rounded-3xl shadow-sm border-2 border-red-50 active:bg-red-50 transition-all uppercase text-sm tracking-widest">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Logout Admin
            </button>
            <p class="text-center text-[9px] text-slate-400 font-bold uppercase mt-6 tracking-widest">Hoyo Piloting v2.0 • Build 2026.04</p>
        </section>
    </main>

    <!-- Bottom Admin Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1e1e1e]/95 backdrop-blur-lg border-t border-white/10 text-white/50 px-6 py-3 flex justify-between items-center z-50">
        <a href="admin-dashboard.html" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
            <span class="text-[10px] font-bold uppercase">Stats</span>
        </a>
        <a href="admin-orders.html" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <span class="text-[10px] font-bold uppercase">Orders</span>
        </a>
        <a href="admin-agents.html" class="flex flex-col items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span class="text-[10px] font-bold uppercase">Agents</span>
        </a>
        <a href="admin-settings.html" class="flex flex-col items-center gap-1 text-blue-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7-3.77a.7.7 0 0 1 .5.31l.4.71a6.7 6.7 0 0 1 0 5.48l-.4.71a.7.7 0 0 1-.5.31l-.8.15c-.27 0-.5.18-.58.44l-.27 1.05c-.1.35-.38.56-.72.56h-1.42c-.34 0-.62-.21-.72-.56l-.27-1.05a.7.7 0 0 0-.58-.44l-.8-.15a.7.7 0 0 1-.5-.31l-.4-.71a6.7 6.7 0 0 1 0-5.48l.4-.71a.7.7 0 0 1 .5-.31l.8-.15c.27 0 .5-.18.58-.44l.27-1.05c.1-.35.38-.56.72-.56h1.42c.34 0 .62.21.72.56l.27 1.05c.08.26.31.44.58.44l.8.15M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10A10 10 0 0 1 2 12 10 10 0 0 1 12 2z"/></svg>
            <span class="text-[10px] font-bold uppercase">Settings</span>
        </a>
    </nav>

</body>
</html>
