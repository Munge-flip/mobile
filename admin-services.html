<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - Admin Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Syne', sans-serif; }</style>
</head>
<body class="bg-[#f1f5f9] min-h-screen pb-24">

    <!-- Header -->
    <header class="p-4 flex items-center justify-between sticky top-0 z-50 bg-[#1e293b] text-white shadow-lg">
        <div class="flex items-center gap-4">
            <a href="admin-dashboard.html" class="p-2 bg-white/10 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <h1 class="text-lg font-bold tracking-tight">Services</h1>
        </div>
        <button class="p-2 bg-blue-500 rounded-xl text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
        </button>
    </header>

    <main class="p-4 space-y-6">
        <!-- Game Tabs -->
        <div class="flex gap-2 overflow-x-auto pb-2">
            <button class="px-6 py-2 bg-blue-600 text-white text-xs font-bold rounded-full whitespace-nowrap">Genshin</button>
            <button class="px-6 py-2 bg-white text-slate-500 text-xs font-bold rounded-full border border-slate-100 whitespace-nowrap">Star Rail</button>
            <button class="px-6 py-2 bg-white text-slate-500 text-xs font-bold rounded-full border border-slate-100 whitespace-nowrap">ZZZ</button>
        </div>

        <!-- Maintenance Section -->
        <section>
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 ml-1">Maintenance</h2>
            <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 divide-y divide-slate-50">
                <div class="p-4 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-800 text-sm">Daily Commissions</p>
                        <p class="text-[10px] text-green-500 font-bold uppercase">Active</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-slate-800">₱57</span>
                        <button class="p-2 bg-slate-50 rounded-lg text-blue-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                        </button>
                    </div>
                </div>
                <div class="p-4 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-800 text-sm">Weekly Bosses</p>
                        <p class="text-[10px] text-green-500 font-bold uppercase">Active</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-slate-800">₱300</span>
                        <button class="p-2 bg-slate-50 rounded-lg text-blue-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
